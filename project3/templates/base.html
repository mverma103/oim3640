<!DOCTYPE html>
<html>
<head>
    <title>Find Nearest MBTA Stop</title>
</head>
<body>
    <h1>MBTA Stop Finder</h1>
    <p>Enter a place name or address to find the nearest MBTA stop.</p>

    <form action="/result" method="POST">
        <label for="place_name">Place name or address:</label>
        <input type="text" id="place_name" name="place_name" required>
        <button type="submit">Find Stop</button>
    </form>
</body>
</html>
