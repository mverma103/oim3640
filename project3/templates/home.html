<!DOCTYPE html>
<html>
<head>
    <title>MBTA Stop Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>MBTA Stop Finder</h1>
        <p>Enter a place name or address to find the nearest MBTA stop.</p>

        <form action="/result" method="POST">
            <input type="text" name="place_name" placeholder="Example: Boston Common" required>
            <button type="submit">Find Stop</button>
        </form>
    </div>
</body>
</html>
